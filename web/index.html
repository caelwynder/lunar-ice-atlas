<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="NASA-IBM Lunar Foundation Model ice-prospectivity predictions for both lunar poles and the nine Artemis candidate landing regions."
    />
    <title>Lunar Ice Atlas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="stage">
      <div id="pole-links">
        <button type="button" data-pole="south">Open South Pole map</button>
        <button type="button" data-pole="north">Open North Pole map</button>
      </div>
      <canvas
        id="moon"
        aria-label="Interactive 3D Moon. Drag to rotate, scroll to zoom; the glowing polar caps open the pole maps."
      ></canvas>
      <header class="title">
        <div class="k">NASA-IBM Lunar Foundation Model</div>
        <h1 class="big">Lunar Ice Atlas</h1>
      </header>
      <nav id="top-bar" aria-label="Moon controls"></nav>
      <p id="status" role="status" aria-live="polite">Loading Moon…</p>
    </div>
    <aside id="info" aria-label="Project information"></aside>
    <main id="map-view" hidden></main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
